name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history + branches, for the master check below

      # releases are tagged on master only, and the tag has to match the version being built
      - name: Check the tag
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME is not on master - releases are tagged on master only"; exit 1
          fi
          version=$(python3 -c "import re; print(re.search(r'^__version__ = \"([^\"]+)\"', open('test_junkie/__init__.py').read(), re.M).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package version $version"; exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/test-junkie
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  smoke-test:
    needs: publish-testpypi
    runs-on: ubuntu-24.04
    steps:
      # no checkout: the smoke test must import the installed package, never a source tree next to the script
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # TestPyPI never replaces a file, and publish-testpypi uses skip-existing, so a version left over from an
      # earlier attempt would be smoke-tested in place of this build. Fetch both files from TestPyPI, require the
      # same SHA-256 as this run's build job, and install that exact wheel.
      - name: Fetch this release from TestPyPI and match it to the build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -m venv smoke-venv
          # straight from TestPyPI's JSON API: no index search, no sdist build, just this version's exact files
          for attempt in $(seq 1 20); do
            python - "$VERSION" <<'PY' && break
          import json, os, socket, sys, urllib.request
          socket.setdefaulttimeout(60)  # a stalled connection fails this attempt instead of hanging the job
          v = sys.argv[1]
          files = json.load(urllib.request.urlopen(f"https://test.pypi.org/pypi/test-junkie/{v}/json"))["urls"]
          kinds = {f["packagetype"] for f in files}
          if not {"bdist_wheel", "sdist"} <= kinds:
              sys.exit(f"TestPyPI lists only {sorted(kinds)} for {v} so far")
          os.makedirs("fetched", exist_ok=True)
          for f in files:
              urllib.request.urlretrieve(f["url"], os.path.join("fetched", f["filename"]))
          PY
            [ "$attempt" = 20 ] && { echo "::error::test-junkie==$VERSION never showed up on TestPyPI"; exit 1; }
            echo "Waiting for TestPyPI to list $VERSION (attempt $attempt)"; rm -rf fetched; sleep 15
          done
          ls -l dist fetched
          (cd dist && sha256sum * | sort -k2) > built.sha256
          (cd fetched && sha256sum * | sort -k2) > fetched.sha256
          cat built.sha256
          if ! diff built.sha256 fetched.sha256; then
            echo "::error::TestPyPI's files for $VERSION are not this run's build (an earlier upload of the same version?)"; exit 1
          fi
          smoke-venv/bin/pip install --no-cache-dir fetched/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/smoke-venv/bin/python" -c "import importlib.metadata as m, test_junkie; v = m.version('test-junkie'); print('smoke testing', v, test_junkie.__file__); assert v == '$VERSION', v; assert 'smoke-venv' in test_junkie.__file__, test_junkie.__file__"

      - name: Run the README example
        run: |
          cat > demo.py <<'EOF'
          from test_junkie.decorators import Suite, beforeTest, afterTest, test, beforeClass, afterClass


          @Suite()
          class ExampleTestSuite:

              @beforeClass()
              def before_class(self):
                  print("Hi, I'm before class")

              @beforeTest()
              def before_test(self):
                  print("Hi, I'm before test")

              @afterTest()
              def after_test(self):
                  print("Hi, I'm after test")

              @afterClass()
              def after_class(self):
                  print("Hi, I'm after class")

              @test()
              def something_to_test1(self):
                  print("Hi, I'm test #1")

              @test()
              def something_to_test2(self):
                  print("Hi, I'm test #2")

              @test()
              def something_to_test3(self):
                  print("Hi, I'm test #3")


          if "__main__" == __name__:
              from test_junkie.runner import Runner
              runner = Runner([ExampleTestSuite])
              result = runner.run()
              report = result.get_basic_report()["tests"]
              assert report["total"] == 3, report
              assert report["success"] == 3, report
              print("Smoke test passed.")
          EOF
          smoke-venv/bin/python demo.py

  publish-pypi:
    needs: smoke-test
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/test-junkie
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
