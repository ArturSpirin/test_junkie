name: Tests

on:
  push:
    branches: [master, staging]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # keep this in sync with setup.py's classifiers/python_requires - latest release + the
        # five prior minor versions
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -r requirements.txt
      - run: pip install -e .

      # both paths write coverage data (see .coveragerc), combined below into one report
      - name: Run pytest path
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: coverage run -m pytest tests/pytest tests/cli tests/cli_edge

      - name: Run test_junkie path
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: coverage run -m test_junkie run -s tests/test_junkie

      - name: Combined coverage
        run: |
          coverage combine
          coverage report
          coverage xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
