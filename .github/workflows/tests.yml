name: Tests

on:
  push:
    branches: [master, staging]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # sample of the versions setup.py supports (3.9 through the latest release): both
        # boundaries plus two in between. Move the upper boundary when a new Python is released.
        # 3.13 also uploads coverage, see below
        python-version: ["3.9", "3.11", "3.13", "3.15"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15.0 (2026-10-09) isn't in setup-python's list yet: this takes rc3 until it is, then the final release
          allow-prereleases: true

      - run: pip install -r requirements.txt
      - run: pip install -e .

      # both paths write coverage data (see .coveragerc), combined below into one report
      # TEST_JUNKIE_HOME keeps Test Junkie's config and temp files in a throwaway dir
      - name: Run pytest path
        env:
          PYTHONPATH: ${{ github.workspace }}
          TEST_JUNKIE_HOME: ${{ runner.temp }}/tj_home
        run: |
          set -o pipefail
          coverage run -m pytest -rfE tests/pytest tests/cli tests/cli_edge 2>&1 | tee pytest_output.txt

      # tj run annotates its own failures here (::error per failed test, at the failing line)
      - name: Run test_junkie path
        env:
          PYTHONPATH: ${{ github.workspace }}
          TEST_JUNKIE_HOME: ${{ runner.temp }}/tj_home
        run: |
          set -o pipefail
          coverage run -m test_junkie run -s tests/test_junkie 2>&1 | tee tj_output.txt

      # job logs need a login to read; annotations don't - so failures stay diagnosable from the public API.
      # Only the pytest path needs this: tj run writes its own annotations
      - name: Annotate pytest failures
        if: failure()
        run: python .github/scripts/annotate_failures.py pytest_output.txt

      - name: Combined coverage
        run: |
          coverage combine
          coverage report
          coverage xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
